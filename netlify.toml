[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://*.firebasedatabase.app https://*.googleapis.com https://script.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;"
